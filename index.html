<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Справочник локалей</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Справочник локалей</h1>
    <!-- Переключатель языка. Логика переключения подписей и названий — M5. -->
    <div class="lang-switch" role="group" aria-label="Язык интерфейса">
      <button type="button" class="lang-btn lang-btn--active">RU</button>
      <button type="button" class="lang-btn">EN</button>
    </div>
  </header>

  <main>
    <!-- Временные строки-заглушки для M1. Реальные данные из /api/locales — M2. -->
    <table class="locales-table">
      <thead>
        <tr>
          <th scope="col">Код</th>
          <th scope="col">Флаг</th>
          <th scope="col">Язык</th>
          <th scope="col">Страна</th>
          <th scope="col">Валюта</th>
          <th scope="col">TLD</th>
          <th scope="col">Столица</th>
          <th scope="col">Таймзона</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>en-AU</td>
          <td>🇦🇺</td>
          <td>Английский</td>
          <td>Австралия</td>
          <td>AUD</td>
          <td>.au</td>
          <td>Канберра</td>
          <td>UTC+10:00</td>
        </tr>
        <tr>
          <td>ru-RU</td>
          <td>🇷🇺</td>
          <td>Русский</td>
          <td>Россия</td>
          <td>RUB</td>
          <td>.ru</td>
          <td>Москва</td>
          <td>UTC+03:00</td>
        </tr>
        <tr>
          <td>fr-FR</td>
          <td>🇫🇷</td>
          <td>Французский</td>
          <td>Франция</td>
          <td>EUR</td>
          <td>.fr</td>
          <td>Париж</td>
          <td>UTC+01:00</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
