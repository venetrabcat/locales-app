<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Справочник локалей</title>
  <!-- Флаги: flag-icons по CDN (fi fi-XX по ISO 3166) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Справочник локалей</h1>
    <!-- Переключатель языка. Логика переключения подписей и названий — M5. -->
    <div class="lang-switch" role="group" aria-label="Язык интерфейса">
      <button type="button" class="lang-btn lang-btn--active">RU</button>
      <button type="button" class="lang-btn">EN</button>
    </div>
  </header>

  <main>
    <input class="search" id="search" type="search" placeholder="Поиск по коду, стране или языку">
    <!-- Строки наполняет app.js из /api/locales (M2) -->
    <table class="locales">
      <thead>
        <tr>
          <th scope="col">Флаг</th>
          <th scope="col">Код</th>
          <th scope="col">Язык</th>
          <th scope="col">Страна</th>
          <th scope="col">Валюта</th>
          <th scope="col">TLD</th>
          <th scope="col">Столица</th>
          <th scope="col">Таймзона</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
